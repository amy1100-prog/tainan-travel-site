<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>台南兩天一夜遊</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      background-color: #fafafa;
    }
    #countdown {
      margin: 20px auto;
      font-size: 18px;
      color: blue;
    }
    .summary {
      margin: 20px auto;
      width: 80%;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: left;
    }
    .summary h2 {
      margin-top: 0;
      color: #007BFF;
    }
    .summary ul {
      list-style: none;
      padding: 0;
    }
    .summary li {
      margin: 8px 0;
      font-size: 16px;
      color: #333;
    }
    .summary a {
      color: #007BFF;
      text-decoration: none;
    }
    .summary a:hover {
      text-decoration: underline;
    }
    .day-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px auto;
      width: 90%;
    }
    .day-section {
      flex: 1 1 45%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: left;
      transition: background-color 0.3s ease;
    }
    .day1 {
      background-color: #e6f2ff; /* 淡藍色 */
    }
    .day1:hover {
      background-color: #cce6ff; /* hover 深藍 */
    }
    .day2 {
      background-color: #e6ffe6; /* 淡綠色 */
    }
    .day2:hover {
      background-color: #ccffcc; /* hover 深綠 */
    }
    .day-section h2 {
      border-left: 5px solid #007BFF;
      padding-left: 10px;
      color: #333;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #007BFF;
    }
    .card p {
      margin: 5px 0 10px;
      color: #555;
    }
    a.activity-link {
      color: #007BFF;
      text-decoration: none;
    }
    a.activity-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>台南兩天一夜遊</h1>
  <p>日期：2026/09/05 ~ 2026/09/06</p>
  
  <!-- 倒數顯示區 -->
  <p id="countdown"></p>

  <!-- 行程摘要區塊 -->
  <div class="summary">
    <h2>行程摘要</h2>
    <ul>
      <li><strong><a href="#day1">Day 1 (9/5)：</a></strong> 艸祭 — 住宿 (四人房型)</li>
      <li><strong><a href="#day2">Day 2 (9/6)：</a></strong> 奇美博物館 — VR 體驗 (16:00–16:30)</li>
    </ul>
  </div>

  <!-- Day1 & Day2 並排 -->
  <div class="day-container">
    <!-- Day 1 -->
    <div class="day-section day1" id="day1">
      <h2>Day 1 (9/5)</h2>
      <div class="card">
        <h3><a class="activity-link" href="http://www.caoji.com.tw/caiji/index.php?page=product_shop&p_id=176814" target="_blank">艸祭 — 住宿 (四人房型)</a></h3>
        <p>時間：19:00</p>
        <p>地址：<a href="https://maps.google.com/?q=艸祭Bookinn 台南市中西區民族路二段318號" target="_blank">台南市中西區民族路二段318號</a></p>
      </div>
    </div>

    <!-- Day 2 -->
    <div class="day-section day2" id="day2">
      <h2>Day 2 (9/6)</h2>
      <div class="card">
        <h3><a class="activity-link" href="https://www.chimeimuseum.org/event/691aeece01a23" target="_blank">奇美博物館 — VR 體驗</a></h3>
        <p>時間：16:00–16:30</p>
        <p>地址：<a href="https://maps.google.com/?q=奇美博物館 台南市仁德區文華路二段66號" target="_blank">台南市仁德區文華路二段66號</a></p>
      </div>
    </div>
  </div>

  <script>
    const startDate = new Date("2026-09-05T00:00:00");
    const endDate = new Date("2026-09-06T23:59:59");
    const countdownElement = document.getElementById("countdown");

    function updateCountdown() {
      const now = new Date();

      if (now < startDate) {
        const diffTime = startDate - now;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const diffHours = Math.floor((diffTime / (1000 * 60 * 60)) % 24);
        const diffMinutes = Math.floor((diffTime / (1000 * 60)) % 60);
        const diffSeconds = Math.floor((diffTime / 1000) % 60);
        countdownElement.textContent = `距離出發還有 ${diffDays} 天 ${diffHours} 小時 ${diffMinutes} 分鐘 ${diffSeconds} 秒`;
      } else if (now >= startDate && now <= endDate) {
        countdownElement.textContent = "行程進行中！好好享受旅遊吧 🎉";
      } else {
        countdownElement.textContent = "行程已結束，快來回顧照片吧 📸";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
