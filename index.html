<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>台南兩天一夜遊</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      background-color: #fafafa;
    }
    .day-section {
      margin: 40px auto;
      width: 80%;
      text-align: left;
    }
    .day-section h2 {
      border-left: 5px solid #007BFF;
      padding-left: 10px;
      color: #333;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #007BFF;
    }
    .card p {
      margin: 5px 0;
      color: #555;
    }
    iframe {
      width: 100%;
      height: 250px;
      border: 0;
      border-radius: 6px;
      margin-top: 10px;
    }
    a.activity-link {
      color: #007BFF;
      text-decoration: none;
    }
    a.activity-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>台南兩天一夜遊</h1>
  <p>日期：2026/09/05 ~ 2026/09/06</p>
  
  <!-- 倒數顯示區 -->
  <p id="countdown" style="color:blue; font-size:18px;"></p>

  <!-- Google 行事曆按鈕 -->
  <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=%E5%8F%B0%E5%8D%97%E5%85%A9%E5%A4%A9%E4%B8%80%E5%A4%9C%E9%81%8A&dates=20260905/20260907&details=%E6%9F%A5%E7%9C%8B%E8%A1%8C%E7%A8%8B%E7%B6%B2%E7%AB%99%EF%BC%9Ahttps%3A%2F%2Famy1100-prog.github.io%2Ftainan-travel-site%2F" target="_blank">
    <button style="padding:10px 20px; font-size:16px;">加入 Google 行事曆</button>
  </a>

  <!-- Day 1 -->
  <div class="day-section">
    <h2>Day 1 (9/5)</h2>
    <div class="card">
      <img src="https://www.caoji.com.tw/caiji/images/product/176814.jpg" alt="艸祭四人房型">
      <h3><a class="activity-link" href="http://www.caoji.com.tw/caiji/index.php?page=product_shop&p_id=176814" target="_blank">艸祭 — 住宿 (四人房型)</a></h3>
      <p>時間：19:00</p>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3672.9312648174055!2d120.20225807588072!3d22.989554917558397!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346e767d5997e87f%3A0x8674e82b188d84e7!2z6Im456WtQm9vayBpbm4!5e0!3m2!1szh-TW!2sus!4v1785465322688!5m2!1szh-TW!2sus" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>

  <!-- Day 2 -->
  <div class="day-section">
    <h2>Day 2 (9/6)</h2>
    <div class="card">
      <img src="https://www.chimeimuseum.org/sites/default/files/styles/large/public/2024-01/vr-event.jpg" alt="奇美博物館 VR 體驗">
      <h3><a class="activity-link" href="https://www.chimeimuseum.org/event/691aeece01a23" target="_blank">奇美博物館 — VR 體驗</a></h3>
      <p>時間：16:00–16:30</p>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3674.4251174367864!2d120.22345187587956!3d22.93456571960558!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346e747aaaaaaaab%3A0xa88c13e665c7f4a6!2z5aWH576O5Y2a54mp6aSo!5e0!3m2!1szh-TW!2sus!4v1785465418778!5m2!1szh-TW!2sus" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>

  <script>
    const startDate = new Date("2026-09-05T00:00:00");
    const endDate = new Date("2026-09-06T23:59:59");
    const countdownElement = document.getElementById("countdown");

    function updateCountdown() {
      const now = new Date();

      if (now < startDate) {
        const diffTime = startDate - now;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const diffHours = Math.floor((diffTime / (1000 * 60 * 60)) % 24);
        const diffMinutes = Math.floor((diffTime / (1000 * 60)) % 60);
        const diffSeconds = Math.floor((diffTime / 1000) % 60);
        countdownElement.textContent = `距離出發還有 ${diffDays} 天 ${diffHours} 小時 ${diffMinutes} 分鐘 ${diffSeconds} 秒`;
      } else if (now >= startDate && now <= endDate) {
        countdownElement.textContent = "行程進行中！好好享受旅遊吧 🎉";
      } else {
        countdownElement.textContent = "行程已結束，快來回顧照片吧 📸";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
