<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>台南兩天一夜遊</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
    }
    .schedule {
      margin: 30px auto;
      width: 90%;
      text-align: left;
      border-collapse: collapse;
    }
    .schedule th, .schedule td {
      border: 1px solid #ccc;
      padding: 10px;
      vertical-align: top;
    }
    .schedule th {
      background-color: #f0f0f0;
    }
    iframe {
      width: 100%;
      height: 250px;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>台南兩天一夜遊</h1>
  <p>日期：2026/09/05 ~ 2026/09/06</p>
  
  <!-- 倒數顯示區 -->
  <p id="countdown" style="color:blue; font-size:18px;"></p>

  <!-- Google 行事曆按鈕（全天事件版本） -->
  <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=%E5%8F%B0%E5%8D%97%E5%85%A9%E5%A4%A9%E4%B8%80%E5%A4%9C%E9%81%8A&dates=20260905/20260907&details=%E6%9F%A5%E7%9C%8B%E8%A1%8C%E7%A8%8B%E7%B6%B2%E7%AB%99%EF%BC%9Ahttps%3A%2F%2Famy1100-prog.github.io%2Ftainan-travel-site%2F" target="_blank">
    <button style="padding:10px 20px; font-size:16px;">加入 Google 行事曆</button>
  </a>

  <!-- 行程表區塊 -->
  <h2>行程表</h2>
  <table class="schedule">
    <tr>
      <th>日期</th>
      <th>時間</th>
      <th>活動</th>
      <th>地圖</th>
    </tr>
    <tr>
      <td>Day 1 (9/5)</td>
      <td>19:00</td>
      <td>住宿：艸祭</td>
      <td>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3673.123456789!2d120.213!3d22.993!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346e768123456789%3A0xabcdef123456789!2z6I-v6I-v!5e0!3m2!1szh-TW!2stw!4v1720000000000" allowfullscreen="" loading="lazy"></iframe>
      </td>
    </tr>
    <tr>
      <td>Day 2 (9/6)</td>
      <td>16:00–16:30</td>
      <td>奇美博物館 VR 體驗</td>
      <td>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3673.123456789!2d120.226!3d22.936!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346e768123456789%3A0xabcdef123456789!2z5qiC5p6X5ZyS5Y-w5Y2X!5e0!3m2!1szh-TW!2stw!4v1720000000000" allowfullscreen="" loading="lazy"></iframe>
      </td>
    </tr>
  </table>

  <script>
    const startDate = new Date("2026-09-05T00:00:00");
    const endDate = new Date("2026-09-06T23:59:59");
    const countdownElement = document.getElementById("countdown");

    function updateCountdown() {
      const now = new Date();

      if (now < startDate) {
        const diffTime = startDate - now;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const diffHours = Math.floor((diffTime / (1000 * 60 * 60)) % 24);
        const diffMinutes = Math.floor((diffTime / (1000 * 60)) % 60);
        const diffSeconds = Math.floor((diffTime / 1000) % 60);
        countdownElement.textContent = `距離出發還有 ${diffDays} 天 ${diffHours} 小時 ${diffMinutes} 分鐘 ${diffSeconds} 秒`;
      } else if (now >= startDate && now <= endDate) {
        countdownElement.textContent = "行程進行中！好好享受旅遊吧 🎉";
      } else {
        countdownElement.textContent = "行程已結束，快來回顧照片吧 📸";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
